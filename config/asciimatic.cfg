valid_characters = " -|\/'^_`"

syslog = false;
threads = 4;

# Canny edge detection default params
threshold1 = 100;
max_threshold1 = 1000;
threshold2 = 300;
max_threshold2 = 1000;

# Source pixels per output character.  The source image is resized to
# (cols * cell_width) x (rows * cell_height) before edge detection, so the
# requested grid is always achievable regardless of input image size.
cell_width = 4;
cell_height = 8;

# Local-search radius in cells.  At 0.5 each cell's character match can
# shift by up to half a cell in either direction; at 1.0, a full cell.
# Larger values let characters lock onto features that straddle cell
# boundaries but also risk neighboring cells stealing each other's
# content.  Set to 0 to disable local search (one position per cell).
# Must be written with a decimal point (e.g. 0.5, not 0).
search_radius = 0.25;

# Bias the matcher toward near-center alignments.  Adds
# (lambda * (dx/cell_w)^2 + (dy/cell_h)^2) to the response surface before
# picking the minimum, so an off-center match has to be meaningfully better
# than a centered one to win.  Counteracts neighbor cells stealing each
# other's content when search_radius is large.  Start at 0.1 and turn up if
# you still see doubled characters along strong features.  0 disables.
shift_penalty = 0.5;
